@if (meta && meta.totalPages > 1) {
  <div class="border-t border-slate-200 px-4 pt-3 pb-2 flex flex-col items-center gap-2">

    <!-- Info -->
    <p class="text-[11px] text-slate-400">
      {{ itemsShown }} de {{ meta.total }} {{ itemLabel }} &mdash; página {{ meta.page }} de {{ meta.totalPages }}
    </p>

    <!-- Botones -->
    <div class="flex items-center gap-1">

      <!-- Anterior -->
      <button (click)="pageChange.emit(currentPage - 1)"
              [disabled]="!meta.hasPrevPage"
              class="h-8 px-2.5 flex items-center gap-1 rounded border text-xs font-semibold transition-colors"
              [class.border-slate-200]="!meta.hasPrevPage"
              [class.text-slate-300]="!meta.hasPrevPage"
              [class.cursor-not-allowed]="!meta.hasPrevPage"
              [class.border-slate-300]="meta.hasPrevPage"
              [class.text-slate-600]="meta.hasPrevPage"
              [class.hover:bg-slate-100]="meta.hasPrevPage">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="hidden sm:inline">Anterior</span>
      </button>

      <!-- Páginas con ellipsis -->
      @for (item of pageItems; track $index) {
        @if (isNumber(item)) {
          <button (click)="pageChange.emit(item)"
                  class="h-8 w-8 rounded border text-xs font-semibold transition-colors"
                  [class.bg-[#1d2b64]]="item === currentPage"
                  [class.text-white]="item === currentPage"
                  [class.border-[#1d2b64]]="item === currentPage"
                  [class.border-slate-200]="item !== currentPage"
                  [class.text-slate-600]="item !== currentPage"
                  [class.hover:bg-slate-100]="item !== currentPage">
            {{ item }}
          </button>
        } @else {
          <span class="h-8 w-6 flex items-end justify-center pb-1 text-slate-400 text-xs select-none">…</span>
        }
      }

      <!-- Siguiente -->
      <button (click)="pageChange.emit(currentPage + 1)"
              [disabled]="!meta.hasNextPage"
              class="h-8 px-2.5 flex items-center gap-1 rounded border text-xs font-semibold transition-colors"
              [class.border-slate-200]="!meta.hasNextPage"
              [class.text-slate-300]="!meta.hasNextPage"
              [class.cursor-not-allowed]="!meta.hasNextPage"
              [class.border-slate-300]="meta.hasNextPage"
              [class.text-slate-600]="meta.hasNextPage"
              [class.hover:bg-slate-100]="meta.hasNextPage">
        <span class="hidden sm:inline">Siguiente</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

    </div>
  </div>
}
