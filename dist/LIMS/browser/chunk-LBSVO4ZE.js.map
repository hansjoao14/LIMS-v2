<div class="p-6 bg-slate-50 min-h-screen text-slate-700 font-sans pb-24">
  <div class="max-w-7xl mx-auto">
    <div class="animate-in fade-in">

      <app-page-header
        breadcrumbSection="Gestión de Vehículos"
        [title]="formularioNombre"
        subtitle="Complete la siguiente información para solicitar un vehículo de la DMRCA"
        codigoFormulario="FOR.ADM.SVR.001.02"
        edicion="12"
      />

      <app-horarios-laborales-formulario
        [editingRecord]="editingRecord"
        (formularioReady)="onFormularioReady($event)"
        (guardado)="onGuardado()"
        (cancelado)="onCancelado()"
      />

      <app-horarios-laborales-lista
        [formularioId]="formularioId"
        [fields]="fields"
        [editingRecordId]="editingRecord?.id ?? null"
        (editar)="onEditar($event)"
      />

    </div>
  </div>
</div>
