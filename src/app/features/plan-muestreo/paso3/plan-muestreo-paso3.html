<div class="p-6 bg-slate-50 min-h-screen text-slate-700 font-sans pb-24">
  <div class="max-w-7xl mx-auto">
    <div class="animate-in fade-in">

      <app-page-header
        breadcrumbSection="Operaciones de campo"
        title="Plan de muestreo"
        subtitle="Aquí podrás visualizar los detalles del plan de muestreo"
        codigoFormulario="F-PEE-42-01"
        edicion="11"
      />

      <!-- Step-card -->
      <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8 space-y-8 animate-in fade-in slide-in-from-right-4">

        <!-- Step-header -->
        <div class="mb-6 border-b border-slate-300 pb-4">
          <h3 class="text-lg font-bold text-[#1e3a8a] mb-1">Paso 3: Procedimiento y Estándares</h3>
        </div>

        @if (loading) {
          <div class="py-16 flex flex-col items-center gap-3">
            <div class="w-8 h-8 border-2 border-slate-200 border-t-[#1e3a8a] rounded-full animate-spin"></div>
            <p class="text-xs text-slate-500">Cargando formulario...</p>
          </div>
        } @else {
          <form [formGroup]="form" class="space-y-8">
            @for (grupo of grupos; track grupo.key) {

              @switch (grupo.key) {

                @case ('procedimiento_muestreo') {
                  <!-- Sección estática: no viene del formulario dinámico -->
                  <section class="border border-slate-200 rounded-sm overflow-hidden shadow-sm">
                    <div class="bg-[#f8fafc] border-b border-slate-200 px-5 py-3">
                      <h4 class="font-bold text-[#1e3a8a] text-sm uppercase">{{ grupo.titulo }}</h4>
                    </div>
                    <div class="p-5">
                      <span class="inline-flex items-center gap-2 bg-[#1e3a8a] text-white text-xs font-bold px-4 py-2 rounded select-none">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        {{ procedimiento }}
                      </span>
                    </div>
                  </section>
                }

                @default {
                  <app-plan-muestreo-grupo [grupo]="grupo" />
                }
              }
            }
          </form>
        }

        <!-- Nav buttons -->
        <div class="flex justify-between pt-4 border-t border-slate-300">
          <button type="button" (click)="regresar()"
            class="bg-white border border-slate-300 text-slate-700 px-8 py-2.5 rounded text-sm font-bold shadow-sm hover:bg-slate-50 transition-all">
            REGRESAR
          </button>
          <button type="button" (click)="guardar()" [disabled]="saving || loading"
            class="bg-[#1e3a8a] text-white px-8 py-2.5 rounded text-sm font-bold shadow-md hover:bg-[#2541b2] transition-all disabled:opacity-60 disabled:cursor-not-allowed">
            {{ saving ? 'GUARDANDO...' : 'GUARDAR' }}
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
