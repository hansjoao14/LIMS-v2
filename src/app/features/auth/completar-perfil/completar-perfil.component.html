<div class="min-h-screen w-full flex font-sans items-center justify-center bg-gray-100">
  <div class="bg-white p-10 rounded-lg shadow-xl w-full max-w-lg relative border-t-4 border-[#28367F]">
    
    <div class="flex justify-center mb-6">
      <img src="/quitologonew 2.png" alt="Quito Logo" class="h-16" />
    </div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-[#28367F]">Completa tu Perfil</h2>
      <p class="text-sm text-gray-600 mt-2">
        Hola <span class="font-semibold text-gray-800">{{ datosUsuarioTemp.nombre }} {{ datosUsuarioTemp.apellido }}</span>, selecciona tu Dirección Metropolitana para continuar.
      </p>
    </div>

    <form [formGroup]="perfilForm" (ngSubmit)="guardarPerfil()" class="space-y-6">
        
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección Metropolitana <span class="text-red-500">*</span></label>
        <select 
          formControlName="entidad_id"
          class="w-full px-4 py-2 mt-1 border rounded focus:outline-none focus:ring-2 focus:ring-[#28367F] bg-white text-gray-700"
          [ngClass]="{'border-red-500': perfilForm.get('entidad_id')?.invalid && perfilForm.get('entidad_id')?.touched}">
          
          <option value="" disabled>-- Seleccione una Dirección --</option>
          <option *ngFor="let direccion of direccionesAmbiente" [value]="direccion.value">
            {{ direccion.label }}
          </option>
        </select>
        
        <div *ngIf="perfilForm.get('entidad_id')?.invalid && perfilForm.get('entidad_id')?.touched" class="text-red-500 text-xs mt-1">
          * La selección de dirección es obligatoria
        </div>
      </div>

      <div class="pt-4 flex gap-4">
        <button 
          type="button"
          routerLink="/login"
          class="w-1/2 py-2 border border-[#28367F] text-[#28367F] font-semibold rounded hover:bg-gray-50 transition">
          Cancelar
        </button>

        <button 
          type="submit" 
          [disabled]="perfilForm.invalid"
          class="w-1/2 py-2 bg-[#28367F] text-white font-semibold rounded hover:bg-blue-800 transition disabled:opacity-50">
          Guardar
        </button>
      </div>

    </form>
  </div>
</div>
