<div class="p-6 bg-slate-50 min-h-screen text-slate-700 font-sans pb-24">
  <div class="max-w-7xl mx-auto">
    <div class="animate-in fade-in">

      <app-page-header
        breadcrumbSection="Operaciones de campo"
        title="Orden de trabajo In Situ"
        subtitle="Aquí podrás visualizar los detalles de la orden de trabajo In Situ"
        [codigoFormulario]="formulario?.descripcion ?? null"
        [edicion]="formulario?.version ?? null"
        [fechaSolicitud]="fechaEmision"
      />

      @if (vista === 'lista') {
        <app-orden-trabajo-in-situ-lista
          (nuevaOrden)="irAFormulario()"
          (editar)="onEditar($event)"
          (imprimir)="imprimirOrden($event)"
        />
      }

      @if (vista === 'formulario') {
        <app-orden-trabajo-in-situ-formulario
          [editingRecord]="editingRecord"
          (guardado)="volverALista()"
          (cancelado)="volverALista()"
        />
      }

    </div>
  </div>
</div>

<!-- Fuera del `.animate-in`: su transform haría de containing block y el visor,
     que es `position: fixed`, no llegaría a ocupar la pantalla completa. -->
<app-pdf-viewer
  [visible]="showPdfModal"
  [loading]="isPdfCargando"
  [pdfBlob]="pdfPreviewBlob"
  [nombreArchivo]="pdfNombre"
  titulo="Orden de Trabajo In Situ"
  (closed)="cerrarPdf()"
>
</app-pdf-viewer>
