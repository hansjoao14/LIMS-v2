<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6 max-w-lg">

  <div class="flex items-center gap-3 mb-6">
    <button type="button" (click)="cancelado.emit()"
      class="h-8 w-8 flex items-center justify-center rounded border border-slate-200 text-slate-500 hover:bg-slate-100 transition-colors">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <h3 class="text-sm font-bold text-slate-700">Nuevo Formulario</h3>
  </div>

  <div class="space-y-4">

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">
        Nombre <span class="text-red-500">*</span>
      </label>
      <input type="text" [(ngModel)]="formData.nombre" placeholder="ej. Formulario de Ingreso"
        class="w-full border border-slate-300 rounded px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
        [disabled]="guardando" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">
          Sigla <span class="text-red-500">*</span>
        </label>
        <input type="text" [(ngModel)]="formData.sigla" placeholder="ej. FI-001"
          class="w-full border border-slate-300 rounded px-3 py-2 text-sm text-slate-700 font-mono uppercase focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
          [disabled]="guardando" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">
          Versión <span class="text-red-500">*</span>
        </label>
        <input type="number" [(ngModel)]="formData.version" min="1"
          class="w-full border border-slate-300 rounded px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
          [disabled]="guardando" />
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción</label>
      <textarea [(ngModel)]="formData.descripcion" rows="2" placeholder="Descripción opcional del formulario"
        class="w-full border border-slate-300 rounded px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition resize-none"
        [disabled]="guardando"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">
          Fecha Emisión <span class="text-red-500">*</span>
        </label>
        <input type="date" [(ngModel)]="formData.fecha_emision"
          class="w-full border border-slate-300 rounded px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
          [disabled]="guardando" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">
          Tipo Formulario <span class="text-red-500">*</span>
        </label>
        @if (loadingTipos) {
          <app-field-skeleton height="h-10" />
        } @else {
          <select [(ngModel)]="formData.ctformulario_id"
            class="w-full border border-slate-300 rounded px-3 py-2 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
            [disabled]="guardando">
            <option [ngValue]="0" disabled>Seleccione un tipo...</option>
            @for (tipo of tiposFormulario; track tipo.id) {
              <option [ngValue]="tipo.id">{{ tipo.nombre }}</option>
            }
          </select>
        }
      </div>
    </div>

  </div>

  <div class="flex items-center gap-3 mt-6">
    <button type="button" (click)="guardar()" [disabled]="guardando"
      class="bg-[#1e3a8a] text-white px-5 py-2 rounded text-sm font-bold shadow-sm hover:bg-[#2541b2] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2">
      @if (guardando) {
        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        Guardando...
      } @else {
        Crear Formulario
      }
    </button>
    <button type="button" (click)="cancelado.emit()" [disabled]="guardando"
      class="px-5 py-2 rounded text-sm font-medium border border-slate-300 text-slate-600 hover:bg-slate-50 disabled:opacity-50 transition-all">
      Cancelar
    </button>
  </div>

</div>
