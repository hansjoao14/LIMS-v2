<div class="p-6 bg-slate-50 min-h-screen text-slate-700 font-sans pb-24">
  <div class="max-w-7xl mx-auto">

    @if (!formularioSeleccionado) {
      <div class="animate-in fade-in">

        <app-page-header
          breadcrumbSection="Configuración"
          title="Administración de Formularios"
          subtitle="Gestione la configuración y atributos de los formularios dinámicos."
        />

        @if (vista === 'lista') {
          <app-admin-formularios-lista
            (nuevo)="irAFormulario()"
            (verDetalle)="abrirDetalle($event)"
          />
        }

        @if (vista === 'formulario') {
          <app-admin-formularios-formulario
            (guardado)="onGuardado()"
            (cancelado)="onCancelado()"
          />
        }

      </div>
    } @else {
      <!-- ── DETALLE ─────────────────────────────────────────────────────────── -->
      <div class="animate-in slide-in-from-right-4">
        <app-formulario-detalle [formulario]="formularioSeleccionado" (regresar)="regresarLista()">
        </app-formulario-detalle>
      </div>
    }

  </div>
</div>
