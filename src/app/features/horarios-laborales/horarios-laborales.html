<div class="p-6 bg-slate-50 min-h-screen text-slate-700 font-sans pb-24">
  <div class="max-w-7xl mx-auto">
    <div class="animate-in fade-in">

      <app-page-header
        breadcrumbSection="Gestión de Vehículos"
        [title]="formularioNombre"
        subtitle="Complete la siguiente información para solicitar un vehículo de la DMRCA"
        [codigoFormulario]="formulario?.descripcion ?? null"
        [edicion]="formulario?.version ?? null"
        [fechaSolicitud]="fechaEmision"
      />

      <app-horarios-laborales-formulario
        [editingRecord]="editingRecord"
        (formularioReady)="onFormularioReady($event)"
        (guardado)="onGuardado()"
        (cancelado)="onCancelado()"
      />

      <app-horarios-laborales-lista
        [formularioId]="formularioId"
        [fields]="fields"
        [editingRecordId]="editingRecord?.id ?? null"
        (editar)="onEditar($event)"
        (imprimir)="onImprimir($event)"
        (firmar)="abrirFirma($event)"
      />

    </div>
  </div>
</div>

<!-- Fuera del wrapper `.animate-in`: su transform lo convertiría en el
     containing block del modal y el PDF quedaría encerrado en esa caja en vez
     de ocupar la pantalla. (CLAUDE.md, "Imprimir un documento") -->
<app-pdf-viewer
  [visible]="showPdfModal"
  [loading]="isPdfCargando"
  [pdfBlob]="pdfPreviewBlob"
  [nombreArchivo]="pdfNombre"
  titulo="Programación de Vehículo"
  (closed)="cerrarPdf()"
/>

<!-- Modal de firma electrónica. Va acá y no en la lista por lo mismo que el
     visor: es `position: fixed` y el `.animate-in` lo confinaría a su caja. -->
<app-firma-electronica
  [mostrar]="mostrarModalFirma"
  [pdfBlob]="pdfFirmaBlob"
  [nombreDocumento]="nombreDocumentoFirma()"
  [cargandoPdf]="cargandoPdfFirma"
  [procesando]="procesandoFirma"
  [errorFirma]="errorFirma"
  (cerrar)="cerrarFirma()"
  (firmar)="confirmarFirma($event)"
/>
