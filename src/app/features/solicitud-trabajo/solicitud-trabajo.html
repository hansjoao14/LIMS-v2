<div class="p-6 bg-[#f8fafc] min-h-screen text-slate-700 font-sans">
  <div class="flex justify-between items-start mb-6">
    <div class="flex items-center">
      <h2 class="text-sm font-medium text-gray-500">Sistema LIMS / <span class="text-blue-700 font-bold">Solicitud de trabajo</span></h2>
    </div>
    <div class="text-right text-xs">
      <h1 class="font-bold text-blue-900 text-sm">Solicitud de trabajo - Ensayos</h1>
      <p class="text-gray-500">Elaborado por: <span class="font-semibold text-slate-700">Tec. Jorge Diaz</span></p>
      <p class="text-gray-500">Fecha de solicitud: <span class="font-semibold text-slate-700">27/05/2025</span></p>
    </div>
  </div>

  <div class="bg-white rounded-sm shadow-sm p-8 border border-gray-200">
    <h3 class="text-xl font-bold mb-1">Solicitud de trabajo</h3>
    <p class="text-sm mb-6 font-semibold">Número de solicitud: <span class="text-slate-700">ST-2025-001</span></p>

    <form [formGroup]="solicitudForm" class="space-y-6">
      <div class="grid grid-cols-12 gap-6">
        <div class="col-span-6">
          <label class="block text-sm font-bold mb-1">Listado de jefaturas o dirección*</label>
          <select formControlName="jefatura" class="w-full border border-gray-300 rounded p-2 bg-gray-50 text-sm text-gray-400 outline-none">
            <option value="">Selecciona una de las opciones</option>
          </select>
        </div>
        <div class="col-span-3">
          <label class="block text-sm font-bold mb-1">Solicitado por*</label>
          <select formControlName="solicitadoPor" class="w-full border border-gray-300 rounded p-2 bg-gray-50 text-sm text-gray-400 outline-none">
            <option value="">Selecciona una de las opciones</option>
          </select>
        </div>
        <div class="col-span-3">
          <label class="block text-sm font-bold mb-1 text-gray-400">Cargo</label>
          <input type="text" disabled placeholder="Se llenara automaticamente" class="w-full border border-gray-200 rounded p-2 bg-gray-100 text-gray-400 text-sm">
        </div>
      </div>

      <div class="mt-8 border-t border-gray-100 pt-6">
        <h4 class="font-bold text-lg mb-4">Información del operador</h4>
        
        <div class="grid grid-cols-12 gap-x-6 gap-y-4">
          <div class="col-span-4">
            <label class="block text-sm font-bold mb-1">RUC del operador*</label>
            <input type="text" formControlName="ruc" placeholder="e.g. 1724165094-001" class="w-full border border-gray-300 rounded p-2 text-sm">
          </div>
          <div class="col-span-4">
            <label class="block text-sm font-bold mb-1">Razón social del operador*</label>
            <input type="text" formControlName="razonSocial" placeholder="e.g. INDUSTRIA ANDINA S.A." class="w-full border border-gray-300 rounded p-2 text-sm">
          </div>
          <div class="col-span-4">
            <label class="block text-sm font-bold mb-1">Horarios o jornadas laborales del operador*</label>
            <div class="flex items-center border border-gray-300 rounded bg-gray-50">
               <span class="px-3 border-r border-gray-300 py-2 text-blue-900">
                 <i class="far fa-calendar"></i> </span>
               <select formControlName="horarios" class="w-full p-2 text-sm bg-transparent outline-none">
                 <option value="">03 / 06 / 2025</option>
               </select>
            </div>
          </div>

          <div class="col-span-6">
            <label class="block text-sm font-bold mb-1">Nombre comercial del operador*</label>
            <input type="text" formControlName="nombreComercial" placeholder="e.g. QuimAndina" class="w-full border border-gray-300 rounded p-2 text-sm mb-4">
            
            <label class="block text-sm font-bold mb-1">Dirección del operador*</label>
            <input type="text" formControlName="direccion" placeholder="e.g. Av. Mariscal sucre N75-270 y Diego de vaquez." class="w-full border border-gray-300 rounded p-2 text-sm">
          </div>

          <div class="col-span-6">
            <label class="block text-sm font-bold mb-1">Motivo*</label>
            <select formControlName="motivo" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 mb-4 text-gray-400">
              <option value="">Selecciona un motivo</option>
            </select>
            
            <label class="block text-sm font-bold mb-1 text-slate-800">Observaciones</label>
            <textarea formControlName="observaciones" rows="3" class="w-full border border-gray-300 rounded p-2 text-xs placeholder-gray-300 resize-none"></textarea>
            <p class="text-right text-[10px] text-gray-400">0/250</p>
          </div>

          <div class="col-span-12 mt-2">
            <label class="block text-sm font-bold mb-1">Coordenadas geográficas del operador*</label>
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold uppercase text-slate-500">Latitud:</span>
                <input type="text" formControlName="latitud" readonly class="w-28 bg-gray-100 border border-gray-200 rounded p-1 text-center text-sm">
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold uppercase text-slate-500">Longitud:</span>
                <input type="text" formControlName="longitud" readonly class="w-28 bg-gray-100 border border-gray-200 rounded p-1 text-center text-sm">
              </div>
              <button type="button" (click)="openMap()" class="bg-[#1e293b] text-white px-5 py-1.5 rounded text-xs font-bold flex items-center gap-2 hover:bg-slate-700 transition uppercase shadow-sm">
                <span class="text-lg">+</span> AGREGAR
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-4 pt-10 border-t border-gray-50">
        <button type="button" class="bg-gray-500 text-white px-12 py-2.5 rounded font-bold uppercase text-xs shadow-sm">Regresar</button>
        <button type="submit" class="bg-[#1e3a8a] text-white px-12 py-2.5 rounded font-bold uppercase text-xs shadow-md">Siguiente</button>
      </div>
    </form>
  </div>
</div>

<div *ngIf="showMapModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="bg-white rounded shadow-xl w-full max-w-2xl overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center">
      <h3 class="font-bold text-xs uppercase">Mapa de Ubicación</h3>
      <button (click)="closeMap()" class="text-2xl">&times;</button>
    </div>
    <div class="p-4">
      <div id="map-container" class="h-80 w-full rounded border border-gray-200"></div>
    </div>
    <div class="p-4 flex justify-end gap-2 bg-gray-50">
      <button (click)="closeMap()" class="px-4 py-2 text-xs font-bold text-gray-600">Cancelar</button>
      <button (click)="confirmLocation()" class="px-6 py-2 bg-[#1e3a8a] text-white rounded text-xs font-bold uppercase">Confirmar Coordenadas</button>
    </div>
  </div>
</div>
