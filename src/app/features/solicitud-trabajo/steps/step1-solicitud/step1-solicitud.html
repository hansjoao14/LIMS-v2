<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8 animate-in fade-in slide-in-from-bottom-4">

  <div class="mb-6 border-b border-slate-300 pb-4">
    <h3 class="text-lg font-bold text-[#1e3a8a] mb-1">Solicitud de trabajo</h3>
    <p class="text-sm text-slate-800">Número de solicitud: <strong class="font-bold">{{ form.get('numero_solicitud')?.value }}</strong></p>
  </div>

  <div class="grid grid-cols-12 gap-6 pb-6 border-b border-slate-300 mb-6">
    <div class="col-span-12 md:col-span-4">
      <label class="block text-[11px] font-bold text-[#1e3a8a] uppercase mb-1" [class.text-red-600]="esCampoInvalido('entidad_id')">LISTADO DE JEFATURAS O DIRECCIÓN *</label>
      <select formControlName="entidad_id" class="w-full border border-slate-300 p-2.5 rounded text-sm bg-white outline-none focus:border-blue-500" [class.border-red-500]="esCampoInvalido('entidad_id')">
        <option value="">Seleccione...</option>
        @for (e of entidadesMock; track e.id) {
          <option [value]="e.id">{{ e.nombre }}</option>
        }
      </select>
    </div>
    <div class="col-span-12 md:col-span-4">
      <label class="block text-[11px] font-bold text-[#1e3a8a] uppercase mb-1" [class.text-red-600]="esCampoInvalido('tecnico_id')">SOLICITADO POR *</label>
      <select formControlName="tecnico_id" class="w-full border border-slate-300 p-2.5 rounded text-sm bg-white outline-none focus:border-blue-500" [class.border-red-500]="esCampoInvalido('tecnico_id')">
        <option value="">Seleccione...</option>
        @for (t of tecnicosFiltrados; track t.id) {
          <option [value]="t.id">{{ t.nombre }}</option>
        }
      </select>
    </div>
    <div class="col-span-12 md:col-span-4">
      <label class="block text-[11px] font-bold text-[#1e3a8a] uppercase mb-1">CARGO</label>
      <input formControlName="cargo_usuario" type="text" class="w-full border border-slate-200 p-2.5 rounded text-sm bg-slate-50 text-slate-500 outline-none">
    </div>
  </div>

  <div class="flex justify-end">
    <button type="button" (click)="next.emit()" class="bg-[#1e3a8a] text-white px-8 py-2.5 rounded text-sm font-bold shadow-md hover:bg-[#2541b2] transition-all">
      SIGUIENTE
    </button>
  </div>
</div>
