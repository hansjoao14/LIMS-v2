<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6 max-w-lg">
  <div class="flex items-center gap-3 mb-6">
    <button
      type="button"
      (click)="cancelado.emit()"
      class="h-8 w-8 flex items-center justify-center rounded border border-slate-200 text-slate-500 hover:bg-slate-100 transition-colors"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <div>
      <h3 class="text-sm font-bold text-slate-700">
        {{ modoEdicion ? 'Editar ítem' : 'Nuevo ítem' }}
      </h3>
      <p class="text-[11px] text-slate-400 mt-0.5">Ensayo: {{ ensayo.analisis }}</p>
    </div>
  </div>

  <div class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">
        Ensayo <span class="text-red-500">*</span>
      </label>
      <app-ensayo-select
        [value]="ensayo_id"
        (valueChange)="ensayo_id = $event"
        [disabled]="saving"
        placeholder="Seleccionar ensayo..."
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">
        Tipo Ambiental <span class="text-red-500">*</span>
      </label>
      <app-item-catalogo-select
        [value]="ctambiental_id"
        (valueChange)="ctambiental_id = $event"
        [disabled]="saving"
        [catalogoId]="CATALOGO_TIPO_AMBIENTAL"
        placeholder="Seleccionar tipo ambiental..."
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">
        Tipo de Ensayo <span class="text-red-500">*</span>
      </label>
      <app-item-catalogo-select
        [value]="cttipo_ensayo_id"
        (valueChange)="cttipo_ensayo_id = $event"
        [disabled]="saving"
        [catalogoId]="CATALOGO_TIPO_ENSAYO"
        placeholder="Seleccionar tipo de ensayo..."
      />
    </div>
  </div>

  <div class="flex items-center gap-3 mt-6">
    <button
      type="button"
      (click)="guardar()"
      [disabled]="saving"
      class="bg-[#1e3a8a] text-white px-5 py-2 rounded text-sm font-bold shadow-sm hover:bg-[#2541b2] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2"
    >
      @if (saving) {
        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          />
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
          />
        </svg>
        Guardando...
      } @else {
        {{ modoEdicion ? 'Actualizar' : 'Crear ítem' }}
      }
    </button>
    <button
      type="button"
      (click)="cancelado.emit()"
      [disabled]="saving"
      class="px-5 py-2 rounded text-sm font-medium border border-slate-300 text-slate-600 hover:bg-slate-50 disabled:opacity-50 transition-all"
    >
      Cancelar
    </button>
  </div>
</div>
