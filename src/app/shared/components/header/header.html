<div
  class="flex flex-col-reverse justify-between gap-6 md:flex-row md:items-center"
>
  <div class="capitalize">
    <nav aria-label="breadcrumb" class="w-max">
      <ol
        class="flex flex-wrap items-center w-full bg-opacity-60 rounded-md bg-transparent p-0 transition-all"
      >
        <li
          class="flex items-center text-blue-gray-900 antialiased font-sans text-sm font-normal leading-normal cursor-pointer transition-colors duration-300 hover:text-light-blue-500"
        >
          <a href="#">
            <p
              class="block antialiased font-sans text-sm leading-normal text-blue-900 font-normal opacity-50 transition-all hover:text-blue-500 hover:opacity-100"
            >
              {{ Title }}
            </p>
          </a>
          <span
            class="text-gray-500 text-sm antialiased font-sans font-normal leading-normal mx-2 pointer-events-none select-none"
            >/</span
          >
        </li>
        <li
          class="flex items-center text-blue-900 antialiased font-sans text-sm font-normal leading-normal cursor-pointer transition-colors duration-300 hover:text-blue-500"
        >
          <p
            class="block antialiased font-sans text-sm leading-normal text-blue-gray-900 font-normal"
          >
            SGIA
          </p>
        </li>
      </ol>
    </nav>
    <h6
      class="block antialiased tracking-normal font-sans text-base font-semibold leading-relaxed text-gray-900"
    >
      SGIA
    </h6>
  </div>

  <div class="flex items-center gap-4">
   <div class="flex items-center bg-gray-50 border border-gray-200 rounded-xl p-1.5 pr-4 gap-3 shadow-sm hover:bg-gray-100 transition-all duration-300">
  
  <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-600 text-white font-bold shadow-md">
    {{ userName.charAt(0) }}
  </div>

  <div class="flex flex-col">
    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold text-blue-900 leading-none">{{ userName }}</span>
      @if (userRoles.length > 0) {
        <span class="bg-blue-100 text-blue-700 text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase tracking-wider">
          {{ userRoles[0] }}
        </span>
      }
    </div>
    <span class="text-[11px] text-gray-500 font-medium">{{ userEmail }}</span>
    
    @if (userRoles.length > 1) {
      <div class="flex gap-1 mt-0.5">
        @for (role of userRoles.slice(1); track role) {
          <span class="text-[9px] text-gray-400 italic">+ {{ role }}</span>
        }
      </div>
    }
  </div>
</div>

    <div class="flex items-center">
      <button
        class="relative middle none font-sans font-medium text-center uppercase transition-all w-10 h-10 rounded-lg text-gray-500 hover:bg-blue-gray-500/10 grid xl:hidden"
        type="button"
      >
        <span
          class="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2"
        >
          <app-hamburger-icon></app-hamburger-icon>
        </span>
      </button>

      <button
        (click)="logout()"
        class="middle none font-sans font-bold center uppercase transition-all text-xs py-3 rounded-lg text-gray-500 hover:bg-blue-gray-500/10 hidden items-center gap-1 px-4 xl:flex"
        type="button"
      >
        <app-user></app-user> Cerrar sesión
      </button>

      <button
        (click)="logout()"
        class="relative middle none font-sans font-medium text-center uppercase transition-all w-10 h-10 rounded-lg text-gray-500 hover:bg-blue-gray-500/10 grid xl:hidden"
        type="button"
      >
        <span
          class="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2"
        >
          <app-user></app-user>
        </span>
      </button>

      <button
        class="relative middle none font-sans font-medium text-center uppercase transition-all w-10 h-10 rounded-lg text-gray-500 hover:bg-blue-gray-500/10"
        type="button"
      >
        <span
          class="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2"
        >
          <app-settings></app-settings>
        </span>
      </button>

      <button
        (click)="notification()"
        class="relative middle none font-sans font-medium text-center uppercase transition-all w-10 h-10 rounded-lg text-gray-500 hover:bg-blue-gray-500/10"
        type="button"
      >
        <span
          class="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2"
        >
          <app-notification-icon></app-notification-icon>
        </span>
      </button>
    </div>
  </div>
</div>
