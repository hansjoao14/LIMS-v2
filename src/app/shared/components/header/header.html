<div class="flex flex-col-reverse justify-between gap-4 md:flex-row md:items-center">

  <!-- Breadcrumb + título -->
  <div class="capitalize min-w-0">
    <nav aria-label="breadcrumb">
      <ol class="flex flex-wrap items-center bg-transparent p-0">
        <li class="flex items-center text-sm font-normal">
          <a href="#">
            <p class="text-blue-900 opacity-50 transition-all hover:text-blue-500 hover:opacity-100 text-sm">
              {{ Title }}
            </p>
          </a>
          <span class="text-gray-500 text-sm mx-2 select-none">/</span>
        </li>
        <li class="flex items-center text-blue-900 text-sm font-normal">
          <p>LIMS</p>
        </li>
      </ol>
    </nav>
    <h6 class="text-base font-semibold leading-relaxed text-gray-900 truncate">LIMS</h6>
  </div>

  <!-- Acciones de usuario -->
  <div class="flex items-center gap-3 shrink-0">

    <!-- Tarjeta de usuario -->
    <div class="flex items-center bg-gray-50 border border-gray-200 rounded-xl p-1.5 pr-3 gap-2 shadow-sm hover:bg-gray-100 transition-all duration-300 min-w-0">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-[#1e3a8a] text-white font-bold shadow-md text-sm">
        {{ userName.charAt(0) }}
      </div>
      <div class="flex flex-col min-w-0 hidden sm:flex">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="text-sm font-semibold text-blue-900 leading-none truncate max-w-[120px]">{{ userName }}</span>
          @if (userRoles.length > 0) {
            <span class="hidden md:inline bg-blue-100 text-blue-700 text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase tracking-wider shrink-0">
              {{ userRoles[0] }}
            </span>
          }
        </div>
        <span class="hidden md:block text-[11px] text-gray-500 font-medium truncate max-w-[160px]">{{ userEmail }}</span>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="flex items-center gap-1">

      <!-- Hamburguesa (visible en < xl) -->
      <button
        (click)="toggleMobileSidebar()"
        class="relative w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-blue-gray-500/10 xl:hidden"
        type="button"
        aria-label="Abrir menú"
      >
        <app-hamburger-icon></app-hamburger-icon>
      </button>

      <!-- Cerrar sesión texto (visible en xl+) -->
      <button
        (click)="logout()"
        class="font-bold text-xs py-3 px-4 rounded-lg text-gray-500 hover:bg-blue-gray-500/10 items-center gap-1 hidden xl:flex"
        type="button"
      >
        <app-user></app-user> Cerrar sesión
      </button>

      <!-- Cerrar sesión ícono (visible en < xl) -->
      <button
        (click)="logout()"
        class="relative w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-blue-gray-500/10 xl:hidden"
        type="button"
        aria-label="Cerrar sesión"
      >
        <app-user></app-user>
      </button>

      <button
        class="relative w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-blue-gray-500/10"
        type="button"
        aria-label="Configuración"
      >
        <app-settings color="#1d2b64"></app-settings>
      </button>

      <button
        (click)="notification()"
        class="relative w-10 h-10 flex items-center justify-center rounded-lg text-gray-500 hover:bg-blue-gray-500/10"
        type="button"
        aria-label="Notificaciones"
      >
        <app-notification-icon></app-notification-icon>
      </button>
    </div>
  </div>
</div>
