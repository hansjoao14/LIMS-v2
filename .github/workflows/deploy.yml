name: 🚀 Deploy LIMS (Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Conectarse al VPS y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== 🚀 INICIO DEPLOY LIMS ==="
            cd /home/LIMS
            
            # Limpiar cualquier bloqueo previo de Git
            rm -f .git/index.lock
            
            # Sincronizar el código (Ahora funcionará por el safe.directory que pusiste)
            git fetch origin main
            git reset --hard origin/main
            
            # Docker: Reinicio quirúrgico (Solo afecta a LIMS)
            # Probamos ambas variantes por si acaso
            docker compose up -d --build --remove-orphans || docker-compose up -d --build --remove-orphans
            
            echo "=== ✅ DEPLOY FINALIZADO ==="