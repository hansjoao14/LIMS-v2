name: 🚀 Deploy LIMS (Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Conectarse al VPS y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            echo "=== 🚀 INICIO DEPLOY LIMS ==="
            
            # Ir a la carpeta del proyecto
            cd /home/LIMS || { echo "❌ Carpeta no encontrada"; exit 1; }

            # 1. Sincronizar código con GitHub usando SSH
            git remote set-url origin git@github.com:capo2786/LIMS.git
            git fetch origin main
            git reset --hard origin/main
            
            echo "🧹 Reiniciando SOLO los contenedores de LIMS..."
            
            # 2. Reconstruir solo lo que está en esta carpeta
            # Usamos 'docker compose' o 'docker-compose' según disponibilidad
            (docker compose down || docker-compose down) || true
            (docker compose up -d --build || docker-compose up -d --build)

            # 3. Limpieza de imágenes basura para no llenar el disco
            docker image prune -f
            
            echo "=== ✅ DEPLOY LIMS FINALIZADO ==="
            echo "🔗 URL: http://173.212.251.64"