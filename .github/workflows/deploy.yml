name: 🚀 Deploy LIMS (Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Conectarse al VPS y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== 🚀 INICIO DEPLOY LIMS ==="
            cd /home/LIMS || (cd /home && git clone git@github.com:capo2786/LIMS.git && cd LIMS)
            
            # Forzar actualización
            git remote set-url origin git@github.com:capo2786/LIMS.git
            git fetch --all
            git reset --hard origin/main
            
            # Docker: Forzar reinicio total
            docker-compose down --remove-orphans || true
            docker-compose up -d --build
            
            # Limpieza rápida
            docker image prune -f
            echo "=== ✅ DEPLOY LIMS FINALIZADO ==="